name: asset-pipeline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Asset Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate integrated art references and pinned source bytes
        run: python3 tools/assets/check_presentation_integration.py

      - name: Test asset pipeline rules (METINAR-009)
        run: dotnet test tests/AssetPipeline.Tests/AssetPipeline.Tests.csproj --configuration Release --logger "console;verbosity=normal"

