name: geo-core-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test geolocation core
        run: dotnet test tests/GeoCore.Tests/GeoCore.Tests.csproj --configuration Release --logger "console;verbosity=normal"
