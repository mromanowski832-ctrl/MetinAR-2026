name: qa-static

# METINAR-011: Unity-free QA checks. No Unity licence, no secrets, no paid services.
# Unity compile / Play Mode / Android builds run locally on Windows via tools/qa/Invoke-MetinARQa.ps1.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: pure .NET tests (all test projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: QA logic tests
        run: dotnet test tests/MetinAR.QA.Tests/MetinAR.QA.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  qa-tooling:
    name: QA tooling (PowerShell lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1,*.psm1 tools) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { $bad++; Write-Host "::error file=$($f.FullName),line=$($x.Extent.StartLineNumber)::$($x.Message)" }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer (errors fail, warnings annotate)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path tools -Recurse -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns,PSAvoidUsingPositionalParameters,PSUseApprovedVerbs,PSUseDeclaredVarsMoreThanAssignments,PSReviewUnusedParameter
          foreach ($i in $r) {
            $lvl = if ($i.Severity -eq 'Error' -or $i.Severity -eq 'ParseError') { 'error' } else { 'warning' }
            Write-Host "::$lvl file=$($i.ScriptPath),line=$($i.Line)::$($i.RuleName): $($i.Message)"
          }
          if (@($r | Where-Object { $_.Severity -in 'Error','ParseError' }).Count) { exit 1 }
      - name: QA tool unit tests
        shell: pwsh
        run: ./tools/qa/tests/Invoke-QaToolTests.ps1
      - name: Device harness simulation (fake adb, not device evidence)
        shell: pwsh
        run: ./tools/qa/tests/Invoke-DeviceSmokeSimulation.ps1
      - name: A31 session collector tests (fake adb, not device evidence)
        shell: pwsh
        run: ./tools/qa/tests/Invoke-DeviceSessionTests.ps1

  repo-checks:
    name: repo hygiene + docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repo hygiene
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_BASE_REF) { "origin/$env:GITHUB_BASE_REF" } else { 'origin/main' }
          ./tools/qa/Test-RepoHygiene.ps1 -BaseRef $base
      - name: Markdown relative links
        shell: pwsh
        run: ./tools/qa/Test-DocLinks.ps1

  pr-metadata:
    name: PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title/body/branches
        shell: pwsh
        run: ./tools/qa/Test-PrMetadata.ps1 -EventPath $env:GITHUB_EVENT_PATH
