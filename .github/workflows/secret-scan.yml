name: Secret Scan (Gitleaks)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret patterns in Git history and changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout including Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (pinned code and scanner version)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Audit complete reachable history without exposing values
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks-8.30.1/gitleaks git --redact --no-banner --log-opts="--all" --exit-code=1 --report-format=json --report-path="$RUNNER_TEMP/gitleaks-history.json" .
