name: Secret Scan (Gitleaks)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret patterns in Git history and changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout including Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (pinned code and scanner version)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Audit complete reachable history without exposing values
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks-8.30.1/gitleaks git --redact --no-banner --log-opts="--all" --exit-code=1 --report-format=json --report-path="$RUNNER_TEMP/gitleaks-history.json" .
      - name: Safe history finding metadata (no secret values)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "gitleaks-history.json"
          if not report.exists():
              print("Full-history report not present; no metadata to summarize.")
              raise SystemExit(0)

          try:
              findings = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              print("Could not read full-history report.")
              raise SystemExit(0)

          if not isinstance(findings, list):
              print("No list of findings in report.")
              raise SystemExit(0)

          print(f"Full-history finding count: {len(findings)}")
          for index, item in enumerate(findings, start=1):
              if not isinstance(item, dict):
                  continue
              # Only known metadata fields: never log Secret, Match, Entropy,
              # Redacted or the raw finding object.
              rule = str(item.get("RuleID", "unknown"))[:60]
              filename = str(item.get("File", "unknown"))[:180]
              commit = str(item.get("Commit", ""))[:12]
              line = item.get("StartLine", "?")
              rule = "".join(ch if 32 <= ord(ch) <= 126 else "_" for ch in rule)
              filename = "".join(ch if 32 <= ord(ch) <= 126 else "_" for ch in filename)
              print(f"{index:02d} | rule={rule} | file={filename} | commit={commit} | line={line}")
          PY
